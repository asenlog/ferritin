[package]
name = "app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "ferritin"
path = "src/main.rs"

[dependencies]
dicom = { path = "../dicom" }
cloud = { path = "../cloud" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
dotenvy = "0.15.7"

[dev-dependencies]
tempfile = "3"
